<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2B2D30"/>
      <stop offset="100%" stop-color="#1E1F22"/>
    </linearGradient>
    <clipPath id="roundedClip">
      <rect width="40" height="40" rx="8" ry="8"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="40" height="40" rx="8" ry="8" fill="url(#bg)"/>

  <g clip-path="url(#roundedClip)">
    <!-- Faint code lines above the region -->
    <rect x="5" y="5" width="10" height="1.5" rx="0.5" fill="#AAAAAA" opacity="0.2"/>
    <rect x="5" y="9" width="16" height="1.5" rx="0.5" fill="#AAAAAA" opacity="0.15"/>

    <!-- Blue region highlight band -->
    <rect x="0" y="13" width="40" height="14" fill="#304674" opacity="0.75"/>

    <!-- Blue accent line top -->
    <rect x="0" y="13" width="40" height="1.4" fill="#4A6FA5" opacity="0.95"/>

    <!-- #reg text inside the highlighted region -->
    <text x="7" y="23.5" font-family="monospace, 'Courier New', Courier" font-size="9" font-weight="bold" fill="#9CDCFE" opacity="0.9">#reg</text>

    <!-- Blue accent line bottom -->
    <rect x="0" y="25.6" width="40" height="1.4" fill="#4A6FA5" opacity="0.95"/>

    <!-- Faint code lines below the region -->
    <rect x="5" y="30" width="14" height="1.5" rx="0.5" fill="#AAAAAA" opacity="0.2"/>
    <rect x="5" y="34" width="8" height="1.5" rx="0.5" fill="#AAAAAA" opacity="0.15"/>
  </g>
</svg>
